[project]
name = "deepresearcher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ShreyasGaikwad-04", email = "shreyasgaikwad004@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.1",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "pypdf>=6.18.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
deepresearcher = "deepresearcher:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
